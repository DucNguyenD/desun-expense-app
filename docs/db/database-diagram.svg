<title id="title">Quan hệ các bảng DeSun theo miền nghiệp vụ</title>
<desc id="desc">Tài khoản sở hữu dữ liệu tài chính, hồ sơ liên kết một-một với tài khoản; ví và danh mục; kế hoạch tài chính; giao dịch. Quan hệ dùng ký hiệu chân quạ, đường thẳng và góc bo tròn.</desc>
