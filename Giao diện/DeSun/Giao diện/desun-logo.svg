<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" fill="none">
  <defs>
    <!-- Sun Gradient: Warm Yellow top to Sunrise Orange bottom -->
    <linearGradient id="ds-sun" x1="48" y1="8" x2="48" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Upper Wave Gradient: Turquoise / Teal -->
    <linearGradient id="ds-wave-top" x1="8" y1="54" x2="90" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Lower Wave Gradient: Deep Ocean Blue -->
    <linearGradient id="ds-wave-bot" x1="12" y1="64" x2="96" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="55%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <filter id="ds-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#F97316" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rising Sun Circle (Clipped by waves below) -->
  <circle cx="50" cy="44" r="32" fill="url(#ds-sun)" filter="url(#ds-glow)" />

  <!-- White Horizon Foam Separation -->
  <path
    d="M 12 58 C 28 48, 48 64, 68 52 C 78 46, 86 48, 92 53 L 92 86 L 12 86 Z"
    fill="#FFFFFF"
  />

  <!-- Top Teal Wave -->
  <path
    d="M 10 61 C 26 50, 46 66, 67 53 C 77 47, 86 49, 92 55 C 83 54, 74 58, 63 65 C 44 76, 26 62, 10 68 Z"
    fill="url(#ds-wave-top)"
  />

  <!-- Bottom Deep Blue Wave -->
  <path
    d="M 14 70 C 30 63, 46 77, 66 66 C 77 59, 85 57, 94 60 C 86 73, 70 82, 50 82 C 33 82, 21 76, 14 70 Z"
    fill="url(#ds-wave-bot)"
  />

  <!-- Bold Sans-Serif Wordmark: "De" (Navy) + "Sun" (Orange) -->
  <text x="108" y="64" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="46" letter-spacing="-1">
    <tspan fill="#1B365D">De</tspan><tspan fill="#F97316">Sun</tspan>
  </text>
</svg>
